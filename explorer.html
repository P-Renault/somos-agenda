<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Encuentra negocios y servicios disponibles en Agenda Ya.">
  <title>Agenda Ya · Encuentra. Elige. Agenda.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public-platform.css">
  <style id="market-customer-header-mobile-fix">
    .market-header-actions .account-button,.market-header-actions .account-button.signed{width:48px;height:48px;min-width:48px;border-radius:50%;overflow:hidden;padding:2px;display:grid;place-items:center}
    .market-header-actions .account-avatar{width:100%;height:100%;min-width:0;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background-size:cover;background-position:center;display:grid;place-items:center}
    .market-notification{width:46px;height:46px;min-width:46px;display:grid;place-items:center;border-radius:50%;border:1px solid #e3ebf4;background:#fff;color:#234568;position:relative;padding:0}
    .market-notification svg{display:block;width:22px;height:22px}.market-notification-emoji{font-size:23px;line-height:1}.market-notification b[hidden]{display:none}
    .market-notification b{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:#e53935;box-shadow:0 0 0 2px #fff}
    .market-notification.has-unread{border-color:#f4b9bd}.market-notification.has-unread .market-notification-emoji{filter:none}
    .market-notifications-panel{position:fixed;z-index:100000;top:92px;right:16px;width:min(410px,calc(100vw - 24px));max-height:calc(100dvh - 125px);overflow:auto;background:#fff;border:1px solid #e1eaf4;border-radius:22px;padding:18px;box-shadow:0 22px 70px #132c4b33;color:#18345b}
    .market-notifications-panel[hidden]{display:none!important}.market-notifications-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.market-notifications-head small{font-size:10px;letter-spacing:.14em;font-weight:900;color:#176fe0}.market-notifications-head h2{margin:3px 0 0;font-size:22px}.market-notifications-head button{width:36px;height:36px;border:1px solid #e1e9f2;background:#f8fbff;border-radius:11px;font-size:23px;color:#536780}.market-notifications-list{display:grid;gap:8px}.market-notification-item{border:1px solid #e8eef5;border-radius:15px;padding:12px;background:#fff}.market-notification-item.unread{background:#f2f7ff;border-color:#d8e8ff}.market-notification-item strong{display:block;font-size:13px}.market-notification-item p{margin:5px 0;color:#687b92;font-size:12px;line-height:1.45}.market-notification-item time{display:block;color:#8795a7;font-size:10px}.market-notification-action{margin-top:8px;border:1px solid #d7e5f6;background:#fff;color:#1266d7;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800}.market-notification-empty{padding:24px 12px;text-align:center;color:#7b8ca0;font-size:13px}
    @media(max-width:700px){.market-notifications-panel{top:84px;right:8px;width:calc(100vw - 16px);max-height:calc(100dvh - 105px);padding:15px}}
    @media(max-width:700px){.market-header{height:76px}.market-brand img{width:190px;height:62px;object-fit:contain;background:transparent}.market-header-actions{gap:8px}.market-header-actions .account-button,.market-header-actions .account-button.signed{width:44px;height:44px;min-width:44px}.market-notification{width:42px;height:42px;min-width:42px}.market-notification svg{width:21px;height:21px}}
  </style>
</head>
<body class="marketplace-page">
<main class="marketplace-shell">
  <header class="market-header">
    <a class="market-brand" href="explorer.html" aria-label="Agenda Ya"><img src="assets/agenda-ya-logo-header.png" alt="Agenda Ya"></a>
    <div class="market-header-actions" id="marketAccount"><a class="publish-link" href="index.html">Publica tu negocio</a><a class="account-button" href="index.html" aria-label="Acceder a tu cuenta"><span class="account-icon">♙</span></a></div>
  </header>
  <section class="market-hero"><div class="hero-backdrop" aria-hidden="true"></div><div class="hero-content">
    <h1>Encuentra. Elige. <span>Agenda.</span></h1><p>Descubre negocios y servicios disponibles.</p>
    <form id="searchForm" class="market-search" novalidate>
      <label class="search-field search-main"><span class="search-svg">⌕</span><input id="query" placeholder="¿Qué necesitas?" autocomplete="off"></label>
      <label class="search-field"><span class="search-svg">⌖</span><input id="city" placeholder="Comuna o ciudad" autocomplete="address-level2"></label>
      <label class="search-field"><span class="search-svg grid-svg">⊞</span><select id="category"><option value="">Todas las categorías</option></select><span class="select-chevron">⌄</span></label>
      <button type="submit">Buscar</button>
    </form>
  </div></section>
  <nav class="category-rail" id="categoryRail" aria-label="Categorías"><button class="category-chip active" data-category=""><span>⊞</span>Todas</button></nav>
  <section class="market-results-bar"><p id="resultStatus">Buscando negocios...</p><button id="clearFilters" type="button" hidden>Limpiar filtros</button></section>
  <section id="results" class="market-grid" aria-live="polite"></section>
</main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="customer-data-engine.js"></script><script src="explorer.js"></script>
<!-- Explorer usa la tarjeta y los motores de notificación del perfil cliente. -->

</body></html>
