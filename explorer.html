<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Explora negocios, profesionales y servicios en Chile. Compara opciones, revisa servicios y reserva horas online con Agenda YA.">
  <link rel="canonical" href="https://agenda-ya.cl/explorer.html">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CL">
  <meta property="og:site_name" content="Agenda YA">
  <meta property="og:title" content="Explora negocios y servicios | Agenda YA">
  <meta property="og:description" content="Encuentra profesionales y negocios, revisa sus servicios y reserva online en Agenda YA.">
  <meta property="og:url" content="https://agenda-ya.cl/explorer.html">
  <meta property="og:image" content="https://agenda-ya.cl/og-agenda-ya.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <title>Explora negocios y servicios en Chile | Agenda YA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public-platform.css">
  <style id="market-customer-header-mobile-fix">
    .market-header-actions .account-button,.market-header-actions .account-button.signed{width:48px;height:48px;min-width:48px;border-radius:50%;overflow:hidden;padding:2px;display:grid;place-items:center}
    .market-header-actions .account-avatar{width:100%;height:100%;min-width:0;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background-size:cover;background-position:center;display:grid;place-items:center}
    .market-notification{width:46px;height:46px;min-width:46px;display:grid;place-items:center;border-radius:50%;border:1px solid #e3ebf4;background:#fff;color:#234568;position:relative;padding:0}
    .market-notification svg{display:block;width:22px;height:22px}
    .market-notification b{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:#e53935}
    @media(max-width:700px){.market-header{height:76px}.market-brand img{width:190px;height:62px;object-fit:contain;background:transparent}.market-header-actions{gap:8px}.market-header-actions .account-button,.market-header-actions .account-button.signed{width:44px;height:44px;min-width:44px}.market-notification{width:42px;height:42px;min-width:42px}.market-notification svg{width:21px;height:21px}}
  </style>

  <style id="market-notifications-panel-style">
    .market-notification{font-size:23px;line-height:1;color:#f3b900}
    .market-notification .market-notification-dot{position:absolute;right:4px;top:4px;width:10px;height:10px;border-radius:50%;background:#e53935;border:2px solid #fff;display:block}.market-notification .market-notification-dot[hidden]{display:none}
    .market-notification .market-notification-dot[hidden]{display:none}
    .market-notifications-panel{position:fixed;z-index:100000;top:calc(env(safe-area-inset-top, 0px) + 170px);right:14px;width:min(660px,calc(100vw - 28px));max-height:min(68vh,760px);overflow:auto;background:#fff;border:1px solid #e4eaf1;border-radius:30px;box-shadow:0 18px 48px #132b4630;color:#1c3555}
    .market-notifications-panel[hidden]{display:none}
    .market-notifications-head{position:sticky;top:0;background:#fff;padding:22px 24px 16px;border-bottom:1px solid #e8edf3;display:flex;align-items:center;justify-content:space-between;z-index:1}
    .market-notifications-head h2{font-size:25px;margin:0;font-weight:800}
    .market-notifications-close{border:0;border-radius:15px;background:#f2f5f9;width:48px;height:48px;font-size:29px;color:#52657b;cursor:pointer}
    .market-notifications-list{padding:8px 22px 18px}
    .market-notification-row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f4;background:#fff;padding:19px 8px;color:inherit;cursor:pointer;font:inherit}
    .market-notification-row:hover,.market-notification-row:focus-visible{background:#f6f9fd;outline:none}
    .market-notification-row.unread{box-shadow:inset 3px 0 #e53935;padding-left:14px}
    .market-notification-row strong{display:block;font-size:18px;margin-bottom:8px}
    .market-notification-row p{font-size:16px;line-height:1.5;color:#6d7b8b;margin:0 0 8px}
    .market-notification-row small{font-size:13px;color:#94a0ad}
    .market-notifications-empty,.market-notifications-error{padding:32px 10px;text-align:center;color:#8491a0;font-size:16px}
    @media(max-width:700px){.market-notifications-panel{top:calc(env(safe-area-inset-top, 0px) + 135px);right:12px;width:calc(100vw - 24px);max-height:68vh;border-radius:28px}.market-notifications-head{padding:20px 22px 14px}.market-notifications-head h2{font-size:24px}.market-notifications-list{padding:8px 18px 16px}.market-notification-row strong{font-size:17px}}
  </style>
</head>
<body class="marketplace-page">
<main class="marketplace-shell">
  <header class="market-header">
    <a class="market-brand" href="explorer.html" aria-label="Agenda Ya"><img src="assets/agenda-ya-logo-header.png" alt="Agenda Ya"></a>
    <div class="market-header-actions" id="marketAccount"><a class="publish-link" href="index.html">Publica tu negocio</a><a class="account-button" href="index.html" aria-label="Acceder a tu cuenta"><span class="account-icon">♙</span></a></div>
  </header>
  <section class="market-hero"><div class="hero-backdrop" aria-hidden="true"></div><div class="hero-content">
    <h1>Encuentra. Elige. <span>Agenda.</span></h1><p>Descubre negocios y servicios disponibles.</p>
    <form id="searchForm" class="market-search" novalidate>
      <label class="search-field search-main"><span class="search-svg">⌕</span><input id="query" placeholder="¿Qué necesitas?" autocomplete="off"></label>
      <label class="search-field"><span class="search-svg">⌖</span><input id="city" placeholder="Comuna o ciudad" autocomplete="address-level2"></label>
      <label class="search-field"><span class="search-svg grid-svg">⊞</span><select id="category"><option value="">Todas las categorías</option></select><span class="select-chevron">⌄</span></label>
      <button type="submit">Buscar</button>
    </form>
  </div></section>
  <nav class="category-rail" id="categoryRail" aria-label="Categorías"><button class="category-chip active" data-category=""><span>⊞</span>Todas</button></nav>
  <section class="market-results-bar"><p id="resultStatus">Buscando negocios...</p><button id="clearFilters" type="button" hidden>Limpiar filtros</button></section>
  <section id="results" class="market-grid" aria-live="polite"></section>
</main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="explorer.js"></script>
</body></html>
