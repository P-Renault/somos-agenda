<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Encuentra negocios y servicios disponibles en Agenda Ya.">
  <title>Agenda Ya · Encuentra. Elige. Agenda.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public-platform.css">
  <style id="market-customer-header-mobile-fix">
    .market-header-actions .account-button,.market-header-actions .account-button.signed{width:48px;height:48px;min-width:48px;border-radius:50%;overflow:hidden;padding:2px;display:grid;place-items:center}
    .market-header-actions .account-avatar{width:100%;height:100%;min-width:0;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background-size:cover;background-position:center;display:grid;place-items:center}
    .market-notification{width:46px;height:46px;min-width:46px;display:grid;place-items:center;border-radius:50%;border:1px solid #e3ebf4;background:#fff;color:#234568;position:relative;padding:0}
    .market-notification svg{display:block;width:22px;height:22px}
    .market-notification b{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:#e53935}
    @media(max-width:700px){.market-header{height:76px}.market-brand img{width:190px;height:62px;object-fit:contain;background:transparent}.market-header-actions{gap:8px}.market-header-actions .account-button,.market-header-actions .account-button.signed{width:44px;height:44px;min-width:44px}.market-notification{width:42px;height:42px;min-width:42px}.market-notification svg{width:21px;height:21px}}
  </style>
</head>
<body class="marketplace-page">
<main class="marketplace-shell">
  <header class="market-header">
    <a class="market-brand" href="explorer.html" aria-label="Agenda Ya"><img src="assets/agenda-ya-logo-header.png" alt="Agenda Ya"></a>
    <div class="market-header-actions" id="marketAccount"><a class="publish-link" href="index.html">Publica tu negocio</a><a class="account-button" href="index.html" aria-label="Acceder a tu cuenta"><span class="account-icon">♙</span></a></div>
  </header>
  <section class="market-hero"><div class="hero-backdrop" aria-hidden="true"></div><div class="hero-content">
    <h1>Encuentra. Elige. <span>Agenda.</span></h1><p>Descubre negocios y servicios disponibles.</p>
    <form id="searchForm" class="market-search" novalidate>
      <label class="search-field search-main"><span class="search-svg">⌕</span><input id="query" placeholder="¿Qué necesitas?" autocomplete="off"></label>
      <label class="search-field"><span class="search-svg">⌖</span><input id="city" placeholder="Comuna o ciudad" autocomplete="address-level2"></label>
      <label class="search-field"><span class="search-svg grid-svg">⊞</span><select id="category"><option value="">Todas las categorías</option></select><span class="select-chevron">⌄</span></label>
      <button type="submit">Buscar</button>
    </form>
  </div></section>
  <nav class="category-rail" id="categoryRail" aria-label="Categorías"><button class="category-chip active" data-category=""><span>⊞</span>Todas</button></nav>
  <section class="market-results-bar"><p id="resultStatus">Buscando negocios...</p><button id="clearFilters" type="button" hidden>Limpiar filtros</button></section>
  <section id="results" class="market-grid" aria-live="polite"></section>
</main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="explorer.js"></script><script src="customer-welcome-notifications.js"></script>
<script>
(()=>{const bell='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';const fix=()=>{const n=document.querySelector('.market-notification');if(n){const span=n.querySelector('span');if(span)span.outerHTML=bell; n.setAttribute('aria-label','Notificaciones');}};fix();new MutationObserver(fix).observe(document.getElementById('marketAccount')||document.body,{childList:true,subtree:true});})();
</script>
</body></html>
