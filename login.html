<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión — Agenda YA</title><style>body{margin:0;font-family:system-ui;background:#f3f8fd;min-height:100vh;display:grid;place-items:center;color:#10254a}.box{width:min(390px,calc(100% - 32px));background:#fff;border:1px solid #e3ebf4;border-radius:22px;padding:32px;box-shadow:0 18px 55px #173d6418}.logo{font-size:30px;font-weight:950;color:#07366d}.logo span{color:#0877eb}h1{font-size:25px;margin:25px 0 6px}p{color:#71839a;font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input{width:100%;height:45px;border:1px solid #dfe8f1;border-radius:10px;padding:0 12px;box-sizing:border-box}.submit{width:100%;height:46px;border:0;border-radius:10px;background:#0877eb;color:#fff;font-weight:900;margin-top:8px}.back{display:block;text-align:center;margin-top:16px;color:#0877eb;font-size:12px}</style></head><body><main class="box"><div class="logo">Agenda<span>YA</span></div><h1>Iniciar sesión</h1><p>Accede a tu cuenta para continuar en Agenda YA.</p><form onsubmit="event.preventDefault();alert('Conecta aquí el flujo de autenticación existente de Agenda YA.');"><div class="field"><label>Correo electrónico</label><input type="email" required></div><div class="field"><label>Contraseña</label><input type="password" required></div><button class="submit">Ingresar</button></form><a class="back" href="index.html">← Volver a Agenda YA</a></main></body></html>
