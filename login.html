<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Agenda YA · Acceso</title>
<style>
:root{
  --blue:#0877e8;
  --blue-dark:#0a2d58;
  --text:#122b50;
  --muted:#6e7887;
  --line:#d9dde3;
  --soft:#f7f9fc;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff}
body{
  min-height:100svh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{touch-action:manipulation}

.auth-page{
  width:100%;
  min-height:100svh;
  background:#fff;
  overflow-x:hidden;
}
.auth-content{
  width:min(100%,690px);
  min-height:100svh;
  margin:0 auto;
  padding:
    max(26px,env(safe-area-inset-top))
    48px
    max(30px,env(safe-area-inset-bottom));
}

/* Back */
.back{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin:0 0 76px;
  padding:0;
  border:0;
  background:transparent;
  color:var(--blue);
  font-size:18px;
  line-height:1;
  font-weight:800;
  cursor:pointer;
}
.back-icon{
  width:25px;
  height:25px;
  display:block;
  flex:none;
}

/* Brand */
.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  margin:0 auto 36px;
}
.brand img{
  display:block;
  width:min(500px,86vw);
  height:auto;
  max-height:155px;
  object-fit:contain;
}

/* Intro */
.subtitle{
  margin:0 auto 68px;
  max-width:570px;
  text-align:center;
  color:#687383;
  font-size:26px;
  line-height:1.38;
  font-weight:400;
  letter-spacing:-.25px;
}

/* Form */
.auth-form{width:100%}
.field{
  display:block;
  margin:0 0 30px;
}
.field-label{
  display:block;
  margin:0 0 10px;
  color:#102b51;
  font-size:22px;
  line-height:1.2;
  font-weight:800;
}
.input-wrap{position:relative;width:100%}
.input{
  display:block;
  width:100%;
  height:84px;
  padding:0 68px 0 82px;
  border:2px solid var(--line);
  border-radius:20px;
  outline:0;
  background:#fff;
  color:#26384e;
  font-size:22px;
  font-weight:400;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.input::placeholder{color:#68717f;opacity:1}
.input:focus{
  border-color:#a8b9ce;
  box-shadow:0 0 0 4px rgba(8,119,232,.07);
}
.field-icon{
  position:absolute;
  left:24px;
  top:50%;
  width:34px;
  height:34px;
  transform:translateY(-50%);
  color:#727d8b;
  pointer-events:none;
}
.eye{
  position:absolute;
  right:21px;
  top:50%;
  width:36px;
  height:36px;
  transform:translateY(-50%);
  padding:5px;
  border:0;
  background:transparent;
  color:#727d8b;
  cursor:pointer;
}
.eye svg,.field-icon svg{width:100%;height:100%}

.primary{
  width:100%;
  height:84px;
  margin:0;
  border:0;
  border-radius:20px;
  background:linear-gradient(135deg,#0b7bf0 0%,#0875e5 100%);
  color:#fff;
  font-size:24px;
  font-weight:850;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(8,119,232,.14);
}
.primary:disabled{opacity:.65;cursor:wait}

.recovery{
  display:block;
  width:100%;
  margin:28px 0 55px;
  padding:0;
  border:0;
  background:transparent;
  color:var(--blue);
  text-align:center;
  font-size:21px;
  line-height:1.2;
  font-weight:800;
  cursor:pointer;
}

/* Divider */
.divider{
  display:flex;
  align-items:center;
  gap:24px;
  width:100%;
  margin:0 0 34px;
  color:#707987;
  font-size:20px;
  line-height:1;
  white-space:nowrap;
}
.divider::before,.divider::after{
  content:"";
  height:2px;
  flex:1;
  background:#dfe2e7;
}
.divider span{display:block}

/* Social */
.social{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:82px;
  margin:0 0 24px;
  padding:0 62px;
  border:2px solid #dce0e5;
  border-radius:20px;
  background:#fff;
  color:#102b51;
  font-size:22px;
  font-weight:800;
  cursor:pointer;
}
.social:last-of-type{margin-bottom:39px}
.social-icon{
  position:absolute;
  left:31px;
  width:39px;
  height:39px;
}
.social-arrow{
  position:absolute;
  right:29px;
  width:26px;
  height:26px;
  color:#687383;
}
.social-icon svg,.social-arrow svg{width:100%;height:100%}

/* Account switch */
.switch{
  margin:0;
  text-align:center;
  color:#707987;
  font-size:21px;
  line-height:1.35;
}
.switch button{
  padding:0;
  border:0;
  background:transparent;
  color:var(--blue);
  font-size:21px;
  font-weight:850;
  cursor:pointer;
}
.secure{
  margin:30px 0 0;
  text-align:center;
  color:#8a94a2;
  font-size:18px;
  line-height:1.3;
}
.status{
  min-height:0;
  margin:10px 0 0;
  text-align:center;
  color:#2d7d5d;
  font-size:15px;
  line-height:1.35;
}
.status.error{color:#c33f3f}

@media (max-width:560px){
  .auth-content{
    padding-left:24px;
    padding-right:24px;
    padding-top:max(24px,env(safe-area-inset-top));
  }
  .back{
    margin-bottom:60px;
    font-size:17px;
  }
  .brand{margin-bottom:28px}
  .brand img{width:min(480px,92vw);max-height:145px}
  .subtitle{
    margin-bottom:48px;
    font-size:21px;
    line-height:1.35;
  }
  .field{margin-bottom:25px}
  .field-label{font-size:19px;margin-bottom:9px}
  .input{
    height:74px;
    border-radius:18px;
    padding-left:70px;
    padding-right:60px;
    font-size:19px;
  }
  .field-icon{left:21px;width:30px;height:30px}
  .eye{right:17px;width:34px;height:34px}
  .primary{
    height:74px;
    border-radius:18px;
    font-size:21px;
  }
  .recovery{
    margin:25px 0 45px;
    font-size:19px;
  }
  .divider{
    gap:16px;
    margin-bottom:27px;
    font-size:18px;
  }
  .social{
    height:70px;
    margin-bottom:18px;
    border-radius:17px;
    padding:0 52px;
    font-size:18px;
  }
  .social-icon{left:25px;width:34px;height:34px}
  .social-arrow{right:22px;width:23px;height:23px}
  .social:last-of-type{margin-bottom:32px}
  .switch{font-size:18px}
  .switch button{font-size:18px}
  .secure{font-size:15px;margin-top:24px}
}

@media (max-height:760px) and (max-width:560px){
  .auth-content{padding-top:18px;padding-bottom:24px}
  .back{margin-bottom:36px}
  .brand{margin-bottom:18px}
  .brand img{max-height:112px}
  .subtitle{font-size:18px;margin-bottom:28px}
  .field{margin-bottom:16px}
  .field-label{font-size:17px;margin-bottom:6px}
  .input{height:58px;font-size:17px;border-radius:14px}
  .field-icon{width:26px;height:26px;left:17px}
  .eye{width:30px;height:30px;right:13px}
  .primary{height:58px;font-size:18px;border-radius:14px}
  .recovery{font-size:17px;margin:17px 0 28px}
  .divider{font-size:16px;margin-bottom:18px}
  .social{height:56px;font-size:16px;border-radius:14px;margin-bottom:12px}
  .social-icon{width:28px;height:28px;left:19px}
  .social-arrow{width:20px;height:20px;right:17px}
  .social:last-of-type{margin-bottom:20px}
  .switch,.switch button{font-size:16px}
  .secure{font-size:13px;margin-top:16px}
}
</style>
<style>
/* AJUSTE COMPACTO — Login Agenda YA */
@media (max-width: 600px) {
  .auth-page, .login-page, .ay-auth-page {
    min-height: 100svh;
    padding: 20px 22px 16px !important;
  }

  .auth-container, .login-container, .ay-auth-card {
    width: 100%;
    max-width: 600px;
  }

  .auth-back, .back-link, .ay-back {
    margin-bottom: 20px !important;
    font-size: 17px !important;
  }

  .auth-logo, .login-logo, .ay-logo {
    max-width: 210px !important;
    margin: 4px auto 16px !important;
  }

  .auth-subtitle, .login-subtitle, .ay-auth-subtitle {
    font-size: 17px !important;
    line-height: 1.35 !important;
    margin-bottom: 22px !important;
  }

  .auth-form label, .login-form label, .ay-auth-form label {
    font-size: 15px !important;
    margin-bottom: 6px !important;
  }

  .auth-input, .login-input, .ay-auth-input,
  .auth-form input, .login-form input, .ay-auth-form input {
    min-height: 54px !important;
    height: 54px !important;
    font-size: 16px !important;
    padding: 0 14px !important;
  }

  .auth-field, .login-field, .ay-auth-field {
    margin-bottom: 14px !important;
  }

  .auth-submit, .login-submit, .ay-auth-submit {
    min-height: 54px !important;
    height: 54px !important;
    font-size: 17px !important;
    margin-top: 4px !important;
  }

  .auth-recovery, .login-recovery, .ay-recovery {
    margin: 13px 0 18px !important;
    font-size: 16px !important;
  }

  .auth-divider, .login-divider, .ay-divider {
    margin: 12px 0 14px !important;
  }

  .auth-social, .login-social, .ay-social {
    min-height: 52px !important;
    height: 52px !important;
    font-size: 16px !important;
    margin-bottom: 10px !important;
  }

  .auth-signup, .login-signup, .ay-signup {
    margin-top: 18px !important;
    font-size: 16px !important;
  }

  .auth-secure, .login-secure, .ay-secure {
    margin-top: 12px !important;
    font-size: 13px !important;
  }
}
</style>
</head>
<body>
<main class="auth-page">
  <section class="auth-content">

    <button class="back" type="button" onclick="goBack()" aria-label="Volver a Agenda YA">
      <svg class="back-icon" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M27 16H6M14 8l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Volver a Agenda YA</span>
    </button>

    <div class="brand">
      <img src="https://p-renault.github.io/somos-agenda/agenda-ya-logo-header.jpg" alt="Agenda Ya">
    </div>

    <p class="subtitle" id="subtitle">Gestiona tu negocio y recibe más reservas<br class="desktop-break"> desde un solo lugar.</p>

    <form class="auth-form" id="authForm">
      <label class="field">
        <span class="field-label">Email</span>
        <span class="input-wrap">
          <svg class="field-icon" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="4" y="7" width="24" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
            <path d="m5.5 9 10.5 8 10.5-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="tu@email.com" required>
        </span>
      </label>

      <label class="field">
        <span class="field-label">Contraseña</span>
        <span class="input-wrap">
          <svg class="field-icon" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="6" y="13" width="20" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
            <path d="M10 13V9.5a6 6 0 0 1 12 0V13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="16" cy="20.5" r="1.7" fill="currentColor"/>
            <path d="M16 22.2v2.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input class="input" id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Ingresa tu contraseña" required>
          <button class="eye" id="eye" type="button" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M4.5 20s5.5-9 15.5-9 15.5 9 15.5 9-5.5 9-15.5 9S4.5 20 4.5 20Z" fill="none" stroke="currentColor" stroke-width="2.4"/>
              <circle cx="20" cy="20" r="4.2" fill="none" stroke="currentColor" stroke-width="2.4"/>
            </svg>
          </button>
        </span>
      </label>

      <button class="primary" id="submit" type="submit">Iniciar sesión&nbsp; →</button>
    </form>

    <p class="status" id="status" aria-live="polite"></p>

    <button class="recovery" id="recovery" type="button">Recuperar contraseña</button>

    <div class="divider"><span>o continuar con</span></div>

    <button class="social" id="google" type="button" aria-label="Continuar con Google">
      <span class="social-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.6c3.3 0 6.3 1.1 8.6 3.2l6.4-6.4C35.1 2.7 29.9.5 24 .5 14.8.5 6.9 5.8 3 13.6l7.5 5.8C12.4 13.7 17.6 9.6 24 9.6Z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.6c-.5 2.8-2.1 5.2-4.5 6.8l7.3 5.7c4.3-4 7.1-9.8 7.1-16.5Z"/>
          <path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.2.8-4.6L3 13.6C1.4 16.7.5 20.2.5 24s.9 7.3 2.5 10.4l7.5-5.8Z"/>
          <path fill="#34A853" d="M24 47.5c6.4 0 11.8-2.1 15.8-6.5l-7.3-5.7c-2 1.4-4.7 2.3-8.5 2.3-6.4 0-11.6-4.1-13.5-9.8L3 33.6c3.9 7.8 11.8 13.9 21 13.9Z"/>
        </svg>
      </span>
      <span>Continuar con Google</span>
      <svg class="social-arrow" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 16h20M18 9l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button class="social" id="facebook" type="button" aria-label="Continuar con Facebook">
      <span class="social-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="23" fill="#1877F2"/>
          <path fill="#fff" d="M27.1 39V26.1h4.3l.6-5h-4.9v-3.2c0-1.5.4-2.5 2.6-2.5h2.7v-4.5c-.5-.1-2.2-.2-4.1-.2-4.1 0-6.9 2.5-6.9 7v3.9h-4.6v5h4.6V39h5.7Z"/>
        </svg>
      </span>
      <span>Continuar con Facebook</span>
      <svg class="social-arrow" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 16h20M18 9l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="switch">
      <span id="switchText">¿No tienes una cuenta?</span>
      <button id="switch" type="button">Crear cuenta</button>
    </div>

    <div class="secure">Acceso seguro con Supabase Auth</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://edlsxmuhbsvtjdtmyhks.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_xyxFhqvIAFL67dIEBQ7pnA_RBC9yXpE';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let mode='login';

function setStatus(text,error=false){
  $('status').textContent=text||'';
  $('status').className='status'+(error?' error':'');
}

function setMode(next){
  mode=next;
  const signup=mode==='signup';
  $('subtitle').innerHTML=signup
    ? 'Crea tu acceso para comenzar a configurar tu perfil.'
    : 'Gestiona tu negocio y recibe más reservas<br class="desktop-break"> desde un solo lugar.';
  $('submit').textContent=signup?'Crear cuenta →':'Iniciar sesión →';
  $('switchText').textContent=signup?'¿Ya tienes una cuenta?':'¿No tienes una cuenta?';
  $('switch').textContent=signup?'Iniciar sesión':'Crear cuenta';
  $('recovery').hidden=signup;
  setStatus('');
}

async function emailAuth(e){
  e.preventDefault();
  setStatus('');
  $('submit').disabled=true;
  try{
    const email=$('email').value.trim();
    const password=$('password').value;
    if(mode==='signup'){
      const r=await sb.auth.signUp({email,password});
      if(r.error) throw r.error;
      setStatus(r.data.session?'Cuenta creada.':'Cuenta creada. Revisa tu correo para confirmar.');
    }else{
      const r=await sb.auth.signInWithPassword({email,password});
      if(r.error) throw r.error;
      afterLogin(r.data.user);
    }
  }catch(err){
    setStatus(err.message||'No fue posible iniciar sesión.',true);
  }finally{
    $('submit').disabled=false;
  }
}

async function oauth(provider){
  setStatus('Conectando con '+(provider==='google'?'Google':'Facebook')+'...');
  try{
    const r=await sb.auth.signInWithOAuth({
      provider,
      options:{redirectTo:window.location.origin+window.location.pathname}
    });
    if(r.error) throw r.error;
  }catch(err){
    setStatus(err.message||'No fue posible iniciar sesión.',true);
  }
}

async function recovery(){
  const email=$('email').value.trim();
  if(!email){
    setStatus('Escribe primero tu correo electrónico.',true);
    return;
  }
  const r=await sb.auth.resetPasswordForEmail(email,{
    redirectTo:window.location.origin+window.location.pathname
  });
  setStatus(
    r.error ? r.error.message : 'Revisa tu correo para recuperar la contraseña.',
    !!r.error
  );
}

function afterLogin(){
  const next=new URLSearchParams(location.search).get('next');
  location.href='./?auth=success'+(next?'&next='+encodeURIComponent(next):'');
}
function goBack(){location.href='./'}

$('authForm').addEventListener('submit',emailAuth);
$('google').onclick=()=>oauth('google');
$('facebook').onclick=()=>oauth('facebook');
$('recovery').onclick=recovery;
$('switch').onclick=()=>setMode(mode==='login'?'signup':'login');
$('eye').onclick=()=>{
  const isPassword=$('password').type==='password';
  $('password').type=isPassword?'text':'password';
  $('eye').setAttribute('aria-label',isPassword?'Ocultar contraseña':'Mostrar contraseña');
};

sb.auth.getSession().then(({data})=>{
  if(data.session) afterLogin();
});
</script>
</body>
</html>
